name: Diagnostic releases
on:
  push:
    paths: [".github/debug-trigger.txt"]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Nettoyage des brouillons de test
        run: |
          for t in debug-probe debug-probe2; do gh release delete "$t" -y --cleanup-tag 2>&1 || true; done
          for id in $(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.draft) | .id'); do gh api -X DELETE repos/${{ github.repository }}/releases/$id 2>&1 || true; done
      - name: Release publique (crée l'étiquette)
        run: |
          gh api -i -X POST repos/${{ github.repository }}/releases -f tag_name=debug-public -f target_commitish=${{ github.sha }} -f name="probe public" -F draft=false -F prerelease=false 2>&1 | grep -v "^[A-Za-z-]*: " | cut -c1-400 || true
      - name: Même chose avec gh release create
        run: gh release create debug-public2 --title probe --notes probe --target ${{ github.sha }} --latest=false 2>&1 || true
      - name: Étiquette seule (API git refs)
        run: gh api -X POST repos/${{ github.repository }}/git/refs -f ref=refs/tags/debug-ref -f sha=${{ github.sha }} 2>&1 | cut -c1-300 || true
      - name: Nettoyage final
        if: always()
        run: |
          for t in debug-public debug-public2 debug-ref; do gh release delete "$t" -y --cleanup-tag 2>&1 || true; gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/$t 2>&1 | head -c 200 || true; done
