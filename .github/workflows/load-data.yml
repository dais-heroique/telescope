name: Charger les données dans Turso

# Construit les données d'un département (ingestion PostGIS éphémère) puis les exporte vers Turso.
# Secrets à créer dans Settings → Secrets and variables → Actions : TURSO_DATABASE_URL, TURSO_AUTH_TOKEN.
on:
  # Déclenchement par un push sur ce fichier (le département est lu dedans) ou à la main
  push:
    paths: [".github/load-trigger.txt"]
  workflow_dispatch:
    inputs:
      dep:
        description: "Code du département (ex. 74)"
        default: "74"
        required: true

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vigie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      INGEST_PG_URL: postgresql://postgres:postgres@localhost:5432/vigie
      INGEST_CACHE_DIR: ${{ runner.temp }}/ingest-cache
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schéma PostGIS d'ingestion
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d vigie -v ON_ERROR_STOP=1 -f scripts/ingest/schema.sql
      - name: Département à charger
        id: dep
        run: |
          DEP="${{ inputs.dep }}"
          if [ -z "$DEP" ]; then DEP="$(tr -d '[:space:]' < .github/load-trigger.txt)"; fi
          echo "dep=$DEP" >> "$GITHUB_OUTPUT"
      - name: Ingestion du département
        run: npx tsx scripts/ingest/all.ts --dep="${{ steps.dep.outputs.dep }}"
      - name: Export vers Turso
        run: npx tsx scripts/export/to-libsql.ts --dep="${{ steps.dep.outputs.dep }}"
