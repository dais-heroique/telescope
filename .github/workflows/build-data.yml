name: Construire les données

# Pour chaque département : ingestion PostGIS éphémère → export SQLite local → découpage en morceaux compressés →
# publication dans la release GitHub « data-<dep> » (hébergement gratuit, lu à la demande par l'application).
# Déclenchement : push sur .github/data-trigger.txt (1re ligne = départements, « metropole » ou « france »),
# ou automatiquement toutes les 6 heures : les 6 départements aux données les plus anciennes sont reconstruits
# (≈ 24 par jour → toute la France rafraîchie en 4 à 5 jours ; l'application voit les nouvelles données en ≤ 10 min).
on:
  push:
    paths: [".github/data-trigger.txt"]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      deps:
        description: "Départements (ex. « 74 73 », « metropole », « france », « anciens:10 » = les 10 plus anciens)"
        default: "74"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.p.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - name: Garder la planification active
        # GitHub suspend les tâches planifiées d'un dépôt public sans activité depuis 60 jours : on la réactive à chaque passage.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build-data.yml/enable" || echo "::warning::réactivation impossible"
      - id: p
        env:
          INPUT_DEPS: ${{ inputs.deps }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW="$INPUT_DEPS"
          if [ "$EVENT" = "schedule" ]; then RAW="anciens:6"; fi
          if [ -z "$RAW" ]; then RAW="$(head -n1 .github/data-trigger.txt)"; fi
          RAW="$(echo "$RAW" | sed 's/#.*//' | tr ',' ' ')"
          METRO="$(printf '%02d ' $(seq 1 19)) 2A 2B $(printf '%02d ' $(seq 21 95))"
          DOM="971 972 973 974 976"
          LIST=""
          EXCL=""
          for t in $RAW; do
            case "$t" in
              !*) EXCL="$EXCL ${t#!}" ;;
              metropole) LIST="$LIST $METRO" ;;
              france) LIST="$LIST $METRO $DOM" ;;
              anciens:[0-9]*)
                # date du manifeste publié par département (absent = jamais construit → prioritaire)
                gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                  --jq '.[] | select(.tag_name | startswith("data-")) | [(.tag_name | ltrimstr("data-")), ([.assets[] | select(.name | startswith("manifest-")) | .updated_at] | first // "0")] | @tsv' > /tmp/dates.tsv
                OLD="$(for d in $METRO $DOM; do printf '%s\t%s\n' "$(awk -F'\t' -v d="$d" '$1==d{print $2}' /tmp/dates.tsv | head -n1 | sed 's/^$/0/')" "$d"; done | sort | head -n "${t#anciens:}" | cut -f2 | tr '\n' ' ')"
                echo "plus anciens : $OLD"
                LIST="$LIST $OLD" ;;
              [0-9][0-9]|2A|2B|97[0-9]) LIST="$LIST $t" ;;
              *) echo "département invalide : $t"; exit 1 ;;
            esac
          done
          for x in $EXCL; do LIST="$(echo $LIST | tr ' ' '\n' | grep -vx "$x" | tr '\n' ' ')"; done
          JSON="$(echo $LIST | tr ' ' '\n' | grep -v '^$' | sort -u | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          echo "départements : $JSON"
          echo "deps=$JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        dep: ${{ fromJson(needs.plan.outputs.deps) }}
    concurrency:
      group: build-data-${{ matrix.dep }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vigie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      INGEST_PG_URL: postgresql://postgres:postgres@localhost:5432/vigie
      INGEST_CACHE_DIR: /tmp/ingest-cache
      DEP: ${{ matrix.dep }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schéma PostGIS d'ingestion
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d vigie -v ON_ERROR_STOP=1 -f scripts/ingest/schema.sql
      - name: Ingestion du département
        # Une source indisponible pour un département (ex. DVF en Alsace-Moselle) ne doit pas bloquer les autres :
        # on continue avec ce qui a pu être chargé (cadastre + features obligatoires : l'export échoue sinon).
        run: npx tsx scripts/ingest/all.ts --dep="$DEP" || echo "::warning::ingestion partielle pour $DEP (voir les erreurs ci-dessus)"
      - name: Export vers un fichier SQLite local
        run: |
          mkdir -p /tmp/work
          TURSO_DATABASE_URL="file:/tmp/work/dept.db" npx tsx scripts/export/to-libsql.ts --dep="$DEP"
          ls -la /tmp/work
      - name: Découpage en morceaux compressés
        run: npx tsx scripts/export/make-shards.ts --dep="$DEP" --db=/tmp/work/dept.db --out=/tmp/work/shards
      - name: Publication dans la release data-${{ matrix.dep }}
        run: |
          TAG="data-$DEP"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Données $DEP" --notes "Données du département $DEP (générées automatiquement, lues par l'application)." --target "$GITHUB_SHA" --latest=false
          # morceaux d'abord, manifeste en dernier : le manifeste ne référence jamais un fichier absent
          for f in /tmp/work/shards/*.db.br; do gh release upload "$TAG" "$f" --clobber; done
          gh release upload "$TAG" "/tmp/work/shards/manifest-$DEP.json" --clobber
          gh release view "$TAG" --json assets -q '.assets | length' | xargs echo "assets publiés :"
