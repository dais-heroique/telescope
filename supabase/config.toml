# Configuration minimale pour la CLI Supabase (`supabase start`).
# Voir https://supabase.com/docs/guides/local-development/cli/config
project_id = "vigie"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
